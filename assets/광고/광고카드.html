<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Noto Sans KR',sans-serif;position:relative}
.bg{position:absolute;inset:0;background:url('광고무드2.png') center/cover}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,251,245,.25) 0%,rgba(255,251,245,.05) 38%,rgba(255,251,245,.55) 72%,rgba(255,251,245,.85) 100%)}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:84px 70px 80px}
.eyebrow{letter-spacing:.26em;font-size:22px;font-weight:800;color:#C2503B}
.badge{margin-top:18px;display:inline-block;background:#FF6F84;color:#fff;font-weight:800;font-size:19px;padding:9px 24px;border-radius:999px;box-shadow:0 10px 24px rgba(255,111,132,.35)}
.spacer{flex:1}
h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:66px;line-height:1.42;color:#2A1D1A}
h1 em{font-style:normal;color:#FF6F84}
.sub{font-size:26px;color:#6b4f48;margin-top:22px;font-weight:500}
.cta{margin-top:38px;background:#2A1D1A;color:#fff;font-size:28px;font-weight:800;padding:23px 62px;border-radius:999px;box-shadow:0 14px 30px rgba(42,29,26,.32)}
.hint{margin-top:18px;font-size:19px;color:#9A6A5E;font-weight:600}
</style></head>
<body>
<div class="bg"></div>
<div class="content">
  <div class="eyebrow">ARTBROWS · 한국 반영구 1위 아카데미</div>
  <div class="badge">소수정예 한정 모집</div>
  <div class="spacer"></div>
  <h1>극사실눈썹 <em>창시자</em>에게,<br>직접 배운다</h1>
  <div class="sub">프리미엄 소수정예 수강생 모집</div>
  <div class="cta">상담 신청하기 →</div>
  <div class="hint">프로필 링크에서 지금 신청하세요</div>
</div>
</body></html>
