<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:#FFFBF5}
.card{width:1080px;height:1350px;display:flex;flex-direction:column}
.visual{height:780px;width:100%;background:url('artbrows-모집카드-시안B.png') center 38%/cover no-repeat;position:relative}
.visual::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom, rgba(255,251,245,0) 68%, #FFFBF5 100%)}
.bodyx{flex:1;background:#FFFBF5;padding:18px 80px 64px;text-align:center;display:flex;flex-direction:column;align-items:center}
.eyebrow{letter-spacing:.32em;font-size:21px;font-weight:700;color:#FF7A66;margin-bottom:24px}
h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:60px;line-height:1.42;color:#3A2A26}
h1 em{font-style:normal;color:#FF6F84}
.sub{font-size:24px;color:#9A6A5E;margin-top:24px;font-weight:500;letter-spacing:.01em}
.cta{margin-top:38px;background:#FF6F84;color:#fff;font-size:27px;font-weight:700;padding:21px 58px;border-radius:999px;box-shadow:0 14px 30px rgba(255,111,132,.34)}
.hint{margin-top:20px;font-size:18px;color:#C2A9A0;letter-spacing:.02em}
</style></head>
<body><div class="card">
  <div class="visual"></div>
  <div class="bodyx">
    <div class="eyebrow">ARTBROWS · 극사실눈썹 창시자</div>
    <h1>극사실눈썹 <em>창시자</em>에게,<br>소수만 직접 배운다</h1>
    <div class="sub">프리미엄 소수정예 수강생 모집</div>
    <div class="cta">상담 신청</div>
    <div class="hint">프로필 링크에서 상담 신청 →</div>
  </div>
</div></body></html>
